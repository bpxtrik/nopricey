services:
  app:
    build: .
    volumes:
      - db_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    volumes:
      - frontend_dist:/output

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - frontend_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_completed_successfully
      app:
        condition: service_started

volumes:
  db_data:
  frontend_dist:
  caddy_data:
  caddy_config:
